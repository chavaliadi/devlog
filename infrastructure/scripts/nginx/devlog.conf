# Nginx Production Site Configuration for Devlog
# Serves React single page application and reverse proxies backend endpoints.
# This template is installed into /etc/nginx/sites-available during application deployment.

server {
    listen 80;
    server_name _;

    # Maximum payload size for code diffs and webhook bodies
    client_max_body_size 10M;

    # Serve compiled React frontend static files
    root /opt/devlog/app/frontend/dist;
    index index.html;

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Single page application routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend REST API endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy for inbound GitHub webhook delivery
    location /webhook/ {
        proxy_pass http://127.0.0.1:5005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Direct health check endpoint for monitoring
    location /health {
        proxy_pass http://127.0.0.1:5005/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
